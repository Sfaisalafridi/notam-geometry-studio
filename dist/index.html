<body>
  <div id="root"></div>
  <!-- GLOBAL ERROR REPORTER -->
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var div = document.createElement('div');
      div.style = "position:fixed; top:0; left:0; right:0; padding:20px; background:red; color:white; z-index:99999; font-family:monospace; white-space:pre-wrap;";
      div.innerText = "CRASH DETECTED:\n" + msg + "\n\n" + url + ":" + line + ":" + col + "\n\n" + (error ? error.stack : 'No stack');
      document.body.appendChild(div);
    };
    window.addEventListener('unhandledrejection', function (event) {
      var div = document.createElement('div');
      div.style = "position:fixed; bottom:0; left:0; right:0; padding:20px; background:orange; color:black; z-index:99999; font-family:monospace; white-space:pre-wrap;";
      div.innerText = "PROMISE REJECTION:\n" + event.reason;
      document.body.appendChild(div);
    });
  </script>
</body>

</html>
